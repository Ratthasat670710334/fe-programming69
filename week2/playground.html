<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>JS Playground</title>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 24px auto; }
  #output { background: #eef6f1; border-left: 4px solid #2f6e5b; padding: 14px 18px;
            white-space: pre-wrap; font-family: monospace; font-size: 15px; min-height: 60px; }
  .error { color: crimson; }
</style>
</head>
<body>

<h1>🧪 JS Playground</h1>
<p>ผลลัพธ์ของ console.log ทุกบรรทัดจะมาแสดงในกรอบนี้ (แก้โค้ดแล้วกด Ctrl+S หน้าจะรีเฟรชเอง)</p>
<pre id="output"></pre>

<script>
// ===== ตัวช่วยแสดงผล: พาผลของ console.log มาแสดงบนหน้าเว็บ =====
// (ยังแสดงใน Console ปกติด้วย / ยังไม่ต้องเข้าใจส่วนนี้ สัปดาห์หน้าเรื่อง DOM จะเข้าใจเอง)
const output = document.getElementById("output");
const _log = console.log;
console.log = function(...args) {
  _log(...args);
  output.textContent += args.map(a =>
    typeof a === "object" && a !== null ? JSON.stringify(a) : String(a)
  ).join(" ") + "\n";
};
window.onerror = function(message) {
  const line = document.createElement("span");
  line.className = "error";
  line.textContent = "❌ " + message + "\n";
  output.appendChild(line);
};
// ===== จบตัวช่วย (อย่าลบส่วนบนนี้) =====

// 👇 ลบโค้ดทดลองเก่า แล้ววางตัวอย่างใหม่ใต้บรรทัดนี้ 👇

let x = 5;       // คำสั่งที่ 1: สร้างตัวแปร x เก็บค่า 5
let y = 6;       // คำสั่งที่ 2: สร้างตัวแปร y เก็บค่า 6
let z = x + y;   // คำสั่งที่ 3: บวก x กับ y แล้วเก็บใน z
console.log(z);  // คำสั่งที่ 4: แสดงค่า z

let age = 18;

if (age >= 18) {
  // บล็อกโค้ดสำหรับคำสั่ง if (ทำเมื่อเงื่อนไขเป็นจริง)
  console.log("You are an adult.");
} else {
  // บล็อกโค้ดสำหรับคำสั่ง else (ทำเมื่อเงื่อนไขเป็นเท็จ)
  console.log("You are a minor.");
}

for (let i = 0; i < 5; i++) {
  // บล็อกโค้ดสำหรับลูป for (ทำซ้ำ 5 รอบ: i = 0,1,2,3,4)
  console.log("Iteration " + i);
}

let $ = "dollar sign";
let $name = "John Doe";
let price$ = 100;
let total$Amount = 200;

console.log($);            // Output: dollar sign
console.log($name);        // Output: John Doe
console.log(price$);       // Output: 100
console.log(total$Amount); // Output: 200



</script>

</body>
</html>
